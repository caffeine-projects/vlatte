# yaml-language-server: $schema=https://vlatte.dev/schemas/http.schema.json
# The endpoint mock of the MCP server at /mcp/: initialize, ping, notifications, tools/list, and the errors of the rest.
id: github
mcp:
  endpoint: /mcp/
  server:
    name: github-mcp-server
    version: mock
---
# get_me answers a caller with a token: the tool's result is the profile as JSON text.
id: github-get-me
request:
  header:
    authorization:
      - hasprefix
      - "Bearer "
mcp:
  endpoint: /mcp/
  tool:
    name: get_me
    description: Get my user profile
mcp_result:
  json:
    login: octocat
    id: 1
    name: The Octocat
    html_url: "https://github.com/octocat"
---
# issue_read answers for issue 42 of octocat/hello-world only.
id: github-issue-read
request:
  header:
    authorization:
      - hasprefix
      - "Bearer "
mcp:
  endpoint: /mcp/
  tool:
    name: issue_read
    description: Get issue details
    input_schema:
      type: object
      properties:
        method:
          type: string
          enum:
            - get
            - get_comments
            - get_sub_issues
            - get_parent
            - get_labels
          description: The read operation to perform on a single issue
        owner:
          type: string
          description: The owner of the repository
        repo:
          type: string
          description: The name of the repository
        issue_number:
          type: number
          description: The number of the issue
        page:
          type: number
          description: Page number for pagination (min 1)
        perPage:
          type: number
          description: "Results per page for pagination (min 1, max 100)"
      required:
        - method
        - owner
        - repo
        - issue_number
    arguments:
      method:
        - equal
        - get
      owner:
        - equal
        - octocat
      repo:
        - equal
        - hello-world
      issue_number:
        - equal
        - 42
mcp_result:
  json:
    number: 42
    title: Found a bug
    state: open
    user:
      login: octocat
    html_url: "https://github.com/octocat/hello-world/issues/42"
---
# A REST route of the same server, beside the MCP endpoint.
id: github-rest-user
request:
  method: GET
  path: /api/user
response:
  status: 200
  header:
    content-type: application/json
  body:
    login: octocat
    id: 1
    name: The Octocat
    html_url: "https://github.com/octocat"
