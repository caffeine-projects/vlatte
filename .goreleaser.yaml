# Builds the vlatte CLI for each release tag: .github/workflows/release.yml runs it, and `make snapshot` runs it
# locally without signing or publishing. The steps of a release are in CONTRIBUTING.md.
version: 2

project_name: vlatte

builds:
  - main: ./cmd/vlatte
    binary: vlatte
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # No -X flags: the binary reads its version from the build info, which Go stamps from the tag.
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

# Keyless: the workflow's OIDC identity signs, and the bundle carries the certificate.
signs:
  - cmd: cosign
    artifacts: checksum
    signature: ${artifact}.sigstore.json
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}

# Sorts v0.1.0 after v0.1.0-rc.2 when both tag one commit. Ignoring tags with a suffix starts a stable release's notes at
# the stable release before it, not at its last release candidate. release.yml names the tag being released, and a
# release candidate's previous tag, so its notes start at the tag before it.
git:
  prerelease_suffix: "-"
  ignore_tags:
    - "*-*"

changelog:
  use: git
  sort: asc
  abbrev: 7
  groups:
    # First, so a feat!: or fix!: lands here and not under its type.
    - title: Breaking changes
      regexp: '^\w+(\([^)]+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\(.+\))??!?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\(.+\))??!?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\(.+\))??!?:.+$'
      order: 3
  filters:
    exclude:
      # Anchored, so a word such as test: in the description drops nothing. No !: a breaking refactor still reaches
      # Breaking changes.
      - '^(chore|ci|docs|refactor|test)(\([^)]+\))?:.+$'

# Tags with a suffix, such as -rc.1, are prereleases.
release:
  prerelease: auto
  # The message of an annotated tag after its first line: write a release's highlights there.
  header: "{{ .TagBody }}"

homebrew_casks:
  - name: vlatte
    # Prereleases are not uploaded: brew installs the latest stable release.
    skip_upload: auto
    repository:
      owner: caffeine-projects
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Casks
    homepage: https://caffeine-projects.github.io/vlatte/
    description: Mock HTTP and gRPC servers for Go tests, and a CLI that serves them from files
    # The binaries are not notarized: macOS would refuse to run them.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/vlatte"]
          end
