# The server answers initialize with an event stream, agrees to the client's protocol version, and starts a session.
id: mcp-initialize
request:
  method: POST
  path: /mcp
  header:
    accept: [contains, text/event-stream]
  body: [jsonpath, $.method, [equal, initialize]]
response:
  status: 200
  header:
    mcp-session-id: weather-1
  event_stream:
    events:
      - event: message
        data: >-
          {{ $r := fromJson .Request.Body.String }}{"jsonrpc": "2.0", "id": {{ $r.id | toJson }}, "result": {
          "protocolVersion": {{ $r.params.protocolVersion | toJson }},
          "capabilities": {"tools": {"listChanged": true}},
          "serverInfo": {"name": "weather", "version": "1.0.0"}}}
  template: {enabled: true}
