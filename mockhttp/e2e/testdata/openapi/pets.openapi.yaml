openapi: 3.1.0
info:
  title: Pets
  version: 1.0.0
servers:
  - url: https://pets.example.com/v1
paths:
  /pets/{id}:
    get:
      summary: Get a pet
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 11111111-1111-4111-8111-111111111111
      responses:
        "200":
          description: The pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
            application/xml:
              schema:
                $ref: "#/components/schemas/Pet"
        "404":
          description: No such pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Try later
  /pets/mine:
    get:
      summary: Get my pet
      responses:
        "200":
          description: My pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
              example:
                id: 22222222-2222-4222-8222-222222222222
                name: Mine
  /tags/{tag}:
    get:
      summary: Get a tag
      parameters:
        - name: tag
          in: path
          required: true
          schema:
            type: string
          example: red fox
      responses:
        "200":
          description: The tag
          content:
            text/plain:
              example: a tag
        "404":
          description: No such tag
  /files/{name}.{ext}:
    get:
      summary: Get a file
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
        - name: ext
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The file
          content:
            text/plain:
              example: a file
components:
  schemas:
    Pet:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
