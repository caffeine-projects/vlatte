request:
  path: /test/templating
  method: POST
  body: 'hello world -> ok'

response:
  status: 200
  header_template:
    test: '{{ .Parameters.Get "test" }}'
    ctx: '{{ .Parameters.Get "context" }}'
    message: '{{ .Extra.message }}'
  body: >
    {{ .Extra.mode }} --> {{ .Extra.lang }} --> {{ .Request.Method }} --> {{ .Request.Header.Get "template" }}
    {{ (.Request.Cookie "cookie_test").Value }}
    Path 0 {{ index .Request.URLPathSegments 0 }}
    Path 1 {{ index .Request.URLPathSegments 1 -}}
  template:
    enabled: true
    data:
      message: hi
      mode: test
      lang: go
