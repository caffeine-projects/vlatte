  <!--
    The layout every admin page shares: its icon, the colors of its light and dark themes, and the navbar's styles. layout puts it
    in each page's head. The theme follows the system until the visitor picks one with the navbar's toggle; the script
    applies that pick before the page paints, so it doesn't flash the other theme.
  -->
  <script>
    try {
      const theme = localStorage.getItem('vlatte-theme')
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
    } catch {
      // Storage may be off: the page follows the system.
    }
  </script>

  <style>

    :root {
      color-scheme: light;
      --bg: #f5ede2;
      --fg: #2c1a12;
      --muted: #7a6355;
      --line: #e5d6c3;
      --panel: #fffaf3;
      --accent: #b4471c;
      --accent-soft: #fce6c4;
      --danger: #b42318;
      --ok: #2f7d32;
      --brand-v: #d9622f;
      --nav-height: 56px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #17100c;
        --fg: #fff3e0;
        --muted: #b9a493;
        --line: #3a2a20;
        --panel: #221812;
        --accent: #f2a93b;
        --accent-soft: #3d2710;

      --bg: #17100c;
      --fg: #fff3e0;
      --muted: #b9a493;
      --line: #3a2a20;
      --panel: #221812;
      --accent: #f2a93b;
      --accent-soft: #3d2710;
      --danger: #f87171;
      --ok: #4ade80;
    }

    .vl-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;

      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      font: 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif;

    .vl-nav a { color: var(--fg); text-decoration: none; }
    .vl-nav a:focus-visible, .vl-nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .vl-links a:hover { background: var(--bg); }
    .vl-links a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

      width: 32px;
      height: 32px;
      padding: 0;

    /* On a phone the links take a row of their own under the name and the buttons. */
    @media (max-width: 600px) {

    }
