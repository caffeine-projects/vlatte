  <!--
    The layout every admin page shares: the colors of its light and dark themes, and the navbar's styles. layout puts it
    in each page's head. The theme follows the system until the visitor picks one with the navbar's toggle; the script
    applies that pick before the page paints, so it doesn't flash the other theme.
  -->
  <script>
    try {
      const theme = localStorage.getItem('vlatte-theme')
      if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
    } catch {
      // Storage may be off: the page follows the system.
    }
  </script>
  <style>
    :root {
      color-scheme: light;
      --bg: #fafaf9;
      --fg: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --panel: #ffffff;
      --accent: #b45309;
      --accent-soft: #fef3c7;
      --danger: #b91c1c;
      --ok: #15803d;
      --nav-height: 52px;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #1c1917;
        --fg: #f5f5f4;
        --muted: #a8a29e;
        --line: #44403c;
        --panel: #292524;
        --accent: #f59e0b;
        --accent-soft: #451a03;
        --danger: #f87171;
        --ok: #4ade80;
      }
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #1c1917;
      --fg: #f5f5f4;
      --muted: #a8a29e;
      --line: #44403c;
      --panel: #292524;
      --accent: #f59e0b;
      --accent-soft: #451a03;
      --danger: #f87171;
      --ok: #4ade80;
    }

    .vl-nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      height: var(--nav-height);
      padding: 0 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      font: 14px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    .vl-nav a { color: var(--fg); text-decoration: none; }
    .vl-nav a:focus-visible, .vl-nav button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .vl-brand { font-weight: 700; font-size: 16px; }
    .vl-brand span { color: var(--accent); }

    .vl-links { display: flex; gap: 4px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
    .vl-links a { padding: 7px 10px; border-radius: 6px; white-space: nowrap; }
    .vl-links a:hover { background: var(--bg); }
    .vl-links a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }

    .vl-tools { display: flex; gap: 8px; margin-left: auto; flex: none; }

    .vl-nav .vl-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      padding: 0;
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--fg);
      cursor: pointer;
    }

    .vl-nav .vl-icon:hover { background: var(--bg); }
    .vl-nav .vl-icon svg { display: block; width: 16px; height: 16px; fill: currentColor; }

    /* On a phone the links take a row of their own under the name and the buttons. */
    @media (max-width: 600px) {
      :root { --nav-height: 92px; }
      .vl-nav { flex-wrap: wrap; align-content: center; row-gap: 8px; }
      .vl-links { order: 3; flex-basis: 100%; margin: 0 -10px; }
    }
  </style>
