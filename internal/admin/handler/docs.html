<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vlatte admin API</title>
  <style>
    /*
      Scalar reads its colors, fonts and spacing from CSS variables, such as --scalar-color-accent, for its light and
      dark modes: set them here to change how the documentation looks.
      See https://scalar.com/products/api-references/themes
    */
    body {
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <!-- Scalar renders the OpenAPI document. Its version is pinned, and the integrity hash is that of the file npm publishes. -->
  <script
    src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.75.1/dist/browser/standalone.js"
    integrity="sha384-G+2Q2i9l3PPfmYkk0b4BAIUrs7xb/DNaTL1wCYYab4c9dIKlCyiqzC0Qx3eq9Wf6"
    crossorigin="anonymous"></script>
  <script>
    // The configuration of the page: see https://scalar.com/products/api-references/configuration
    Scalar.createApiReference('#app', {
      // The admin API's own document, next to this page: /openapi.
      url: 'openapi',
      // Past the script itself, the page reaches no third party: no telemetry, assistants or web fonts.
      telemetry: false,
      withDefaultFonts: false,
      agent: { disabled: true },
      mcp: { disabled: true },
      showDeveloperTools: 'never',
    })
  </script>
</body>
</html>
