<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>vlatte admin API</title>
  <!-- layout:head -->
  <style>
    /*
      Scalar reads its colors, fonts and spacing from CSS variables, such as --scalar-color-accent, for its light and
      dark modes: set them here to change how the documentation looks.
      See https://scalar.com/products/api-references/themes
    */
    /* Scalar takes the brand's colors of the theme shown: the class of the body is the theme. */
    body.light-mode,
    body.dark-mode {
      --scalar-background-1: var(--bg);
      --scalar-background-2: var(--panel);
      --scalar-color-1: var(--fg);
      --scalar-color-2: var(--muted);
      --scalar-color-accent: var(--accent);
      --scalar-border-color: var(--line);
    }

    body {
      margin: 0;
      /* Scalar keeps its sticky header and sidebar under the navbar. */
      --scalar-custom-header-height: var(--nav-height);
    }
  </style>
</head>
<body>
<!-- layout:nav -->
  <div id="app"></div>
  <!--
    Scalar renders the OpenAPI document. Its version is pinned, and the integrity hash is that of the file npm
    publishes, unless the admin API was given another version, whose hash isn't known. Docs fills in both.
  -->
  <script
    src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@{version}/dist/browser/standalone.js"
    {integrity}
    crossorigin="anonymous"></script>
  <script>
    // Scalar takes the theme of the navbar's toggle, and hides its own.
    const theme = () =>
      document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')

    // The configuration of the page: see https://scalar.com/products/api-references/configuration
    Scalar.createApiReference('#app', {
      // The admin API's own document, next to this page at /docs: /openapi.
      url: 'openapi',
      // Past the script itself, the page reaches no third party: no telemetry, assistants or web fonts.
      telemetry: false,
      withDefaultFonts: false,
      agent: { disabled: true },
      mcp: { disabled: true },
      showDeveloperTools: 'never',
      forceDarkModeState: theme(),
      hideDarkModeToggle: true,
    })

    // Scalar reads the forced theme once, and themes the page by a class of the body: a change sets the class.
    const follow = () => {
      const dark = theme() === 'dark'
      document.body.classList.toggle('dark-mode', dark)
      document.body.classList.toggle('light-mode', !dark)
    }
    addEventListener('vlatte-theme', follow)
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', follow)
  </script>
</body>
</html>
