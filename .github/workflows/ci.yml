name: "CI"

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - '[0-9]+.x'
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'
  pull_request:
    paths:
      - '**'
      - '!docs/**'
      - '!**.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: 'go.mod'
        cache: true

    - name: Deps
      run: make deps

    - name: Lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.1

    - name: Test
      run: make testci

    - name: Coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
