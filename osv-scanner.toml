# Advisories the OSV scanner, and the OpenSSF Scorecard that runs it, must not count. Each needs a reason, and leaves
# once a fixed version exists.

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is unmaintained and has no fixed version. vlatte never imports it: x/crypto comes in for sha3, through github.com/google/go-jsonnet, and for golang.org/x/net."

[[IgnoredVulns]]
id = "GHSA-fc5q-39xc-vjpf"
reason = "picomatch has no fixed version. It is a dev-only dependency of the docs site, through vitepress and vite, and runs only while the docs site is built or served, in CI or locally, on globs from vite, vitepress and the repo's docs config, never user input. picomatch is not bundled into the published site, and no Go module depends on it."
