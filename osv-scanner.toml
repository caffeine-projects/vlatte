# Advisories the OSV scanner, and the OpenSSF Scorecard that runs it, must not count. Each needs a reason, and leaves
# once a fixed version exists.

[[IgnoredVulns]]
id = "GO-2026-5932"
reason = "golang.org/x/crypto/openpgp is unmaintained and has no fixed version. vlatte never imports it: x/crypto comes in for sha3, through github.com/google/go-jsonnet, and for golang.org/x/net."
